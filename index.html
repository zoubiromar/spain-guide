<style>
  :root { color-scheme: light; --text: #1c2733; --muted: #5a6775; --border: #d5dde5; --accent: #1f6feb; --fail: #b42318; }

<script>
(function () {
  'use strict';
  var STORE = 'spain-guide-site:key';
  var payload = JSON.parse(document.getElementById('payload').textContent);
  var form = document.getElementById('unlock'), msg = document.getElementById('msg'), go = document.getElementById('go');
  function bytes(b64) { var bin = atob(b64), u = new Uint8Array(bin.length); for (var i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return u; }
  function b64(buf) { var u = new Uint8Array(buf), s = ''; for (var i = 0; i < u.length; i++) s += String.fromCharCode(u[i]); return btoa(s); }
  var salt = bytes(payload.salt), iv = bytes(payload.iv), ct = bytes(payload.ct);
  function show(text) { msg.textContent = text || ''; go.disabled = false; go.textContent = 'Open'; }
  function render(plain) {
    var html = new TextDecoder().decode(plain);
    // document.open() is ignored while this page is still parsing, so wait for the parser to finish.
    function swap() { document.open(); document.write(html); document.close(); }
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', swap, { once: true });
    else swap();
  }
  function remembered() {
    try { var o = JSON.parse(localStorage.getItem(STORE) || 'null'); return o && o.salt === payload.salt ? o.key : null; } catch (e) { return null; }
  }
  if (!window.crypto || !crypto.subtle) { show('This browser cannot open encrypted pages. Use an up-to-date browser over https.'); return; }
  var saved = remembered();
  if (saved) {
    crypto.subtle.importKey('raw', bytes(saved), { name: 'AES-GCM' }, false, ['decrypt'])
      .then(function (key) { return crypto.subtle.decrypt({ name: 'AES-GCM', iv: iv }, key, ct); })
      .then(render)
      .catch(function () { try { localStorage.removeItem(STORE); } catch (e) { /* ignore */ } show(''); });
  }
  form.addEventListener('submit', function (ev) {
    ev.preventDefault();
    var pass = document.getElementById('pass').value;
    if (!pass) return;
    go.disabled = true; go.textContent = 'Opening'; msg.textContent = '';
    var keep = document.getElementById('remember').checked, key;
    crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveKey'])
      .then(function (base) {
        return crypto.subtle.deriveKey({ name: 'PBKDF2', salt: salt, iterations: payload.iter, hash: 'SHA-256' }, base,
          { name: 'AES-GCM', length: 256 }, true, ['decrypt']);
      })
      .then(function (k) { key = k; return crypto.subtle.decrypt({ name: 'AES-GCM', iv: iv }, key, ct); })
      .then(function (plain) {
        if (!keep) { try { localStorage.removeItem(STORE); } catch (e) { /* ignore */ } return render(plain); }
        return crypto.subtle.exportKey('raw', key).then(function (raw) {
          try { localStorage.setItem(STORE, JSON.stringify({ salt: payload.salt, key: b64(raw) })); } catch (e) { /* not remembered */ }
          render(plain);
        });
      })
      .catch(function () { show('That passphrase did not open the guide. Check it and try again.'); });
  });
})();
</script>
